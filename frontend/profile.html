<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile · Sociall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>
<main class="page-container">
  <div id="profileHeader"></div>
  <section class="profile-posts-section">
    <h3 class="section-title">Posts</h3>
    <div id="profilePosts" class="feed"></div>
  </section>
</main>

<div id="editModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3>Edit Profile</h3>
      <button id="closeEditModal" class="icon-btn">✕</button>
    </div>
    <form id="editProfileForm" class="modal-body">
      <div class="avatar-edit-row">
        <div id="editAvatarPreview"></div>
        <label class="btn btn-secondary btn-sm">
          Change Photo
          <input type="file" id="editAvatarInput" accept="image/*" hidden>
        </label>
      </div>
      <div class="form-group">
        <label for="editName">Name</label>
        <input type="text" id="editName" required maxlength="100">
      </div>
      <div class="form-group">
        <label for="editBio">Bio</label>
        <textarea id="editBio" rows="3" maxlength="250"></textarea>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Save Changes</button>
    </form>
  </div>
</div>

<div id="listModal" class="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="listModalTitle">Followers</h3>
      <button id="closeListModal" class="icon-btn">✕</button>
    </div>
    <div id="listModalBody" class="modal-body user-list"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
