<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed · Sociall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>
<main class="page-container">
  <div class="feed-layout">
    <section class="composer-card">
      <div class="composer-top">
        <div id="composerAvatar"></div>
        <form id="postForm" class="composer-form">
          <textarea id="postContent" placeholder="What's on your mind?" rows="3" maxlength="2000"></textarea>
          <div id="imagePreview" class="image-preview"></div>
          <div class="composer-actions">
            <label class="composer-image-btn">
              🖼️ Photo
              <input type="file" id="postImageInput" accept="image/*" hidden>
            </label>
            <button type="submit" class="btn btn-primary">Post</button>
          </div>
        </form>
      </div>
    </section>
    <section id="feed" class="feed"></section>
    <button id="loadMoreBtn" class="btn btn-secondary btn-full load-more-btn">Load more</button>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/toast.js"></script>
<script src="js/api.js"></script>
<script src="js/nav.js"></script>
<script src="js/feed.js"></script>
</body>
</html>
